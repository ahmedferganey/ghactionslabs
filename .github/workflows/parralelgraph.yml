name: Jobs Graph Lab

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Simulate Lint Check
        run: |
          echo "Starting lint check..."
          echo "Checking code formatting..."
          echo "Lint check passed."


  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Run Unit Test
        run: |
          echo "Starting unit tests..."

          RESULT=$((2 + 3))

          if [ "$RESULT" -eq 5 ]; then
            echo "Unit test passed: 2 + 3 = 5"
          else
            echo "Unit test failed"
            exit 1
          fi


  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Simulate Security Audit
        run: |
          echo "Starting security audit..."
          echo "Checking for security problems..."
          echo "No security vulnerabilities detected."


  build:
    name: Build Application

    needs:
      - lint
      - unit-test
      - security

    runs-on: ubuntu-latest

    steps:
      - name: Build Application
        run: |
          echo "Starting build..."
          mkdir -p dist
          echo "Application Build Version 1.0" > dist/app.txt
          echo "Build completed successfully."

      - name: Show Build Files
        run: |
          echo "Build directory:"
          ls -la dist
          echo ""
          echo "Build content:"
          cat dist/app.txt


  deploy-staging:
    name: Deploy to Staging

    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Deploy Staging
        run: |
          echo "Starting staging deployment..."
          echo "Application deployed to staging successfully."


  integration-test:
    name: Integration Tests

    needs: deploy-staging

    runs-on: ubuntu-latest

    steps:
      - name: Run Integration Test
        run: |
          echo "Starting integration tests..."

          SERVICE_A="available"
          SERVICE_B="available"

          if [ "$SERVICE_A" = "available" ] && [ "$SERVICE_B" = "available" ]; then
            echo "Integration test passed."
          else
            echo "Integration test failed."
            exit 1
          fi


  deploy-production:
    name: Deploy to Production

    needs: integration-test

    runs-on: ubuntu-latest

    steps:
      - name: Deploy Production
        run: |
          echo "Starting production deployment..."
          echo "Application deployed to production successfully."
