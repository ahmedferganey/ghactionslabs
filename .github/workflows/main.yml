name: First Workflow

on:
  push:
    branches:
      - main

jobs:
  example-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print a Welcome Message
        run: echo "Welcome to our first Github Actions Workflow"
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Lists repo files
        run: ls -la
